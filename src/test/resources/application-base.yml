server.port: 8083

spring:
  application:
    name: product-catalog
  data:
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://algashop-authorization-server:8081

logging:
  level:
    org.mongodb.driver.protocol.command: DEBUG
    org.mongodb.driver.protocol.query: DEBUG
    org.mongodb.driver.connection: DEBUG

algashop:
  data-load:
    enabled: true
    auto-delete: true
    sources:
      - location: db/testdata/categories.json
        collection: categories
      - location: db/testdata/products.json
        collection: products
